<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<script>
function predictprice(){
    var fd = new FormData(document.querySelector('form')) // in fd we have collected all the input data 
    var xhr = new XMLHttpRequest() // xhr is resposible to communicate with application.py
    xhr.open('post','/predict',true)
    xhr.onreadystatechange = function(){
        if(xhr.readyState == XMLHttpRequest.DONE){
            document.getElementById('result').innerHTML = xhr.responseText
        }
    }
    xhr.onload = function(){}
    xhr.send(fd)
}
</script>

<body class="bg-dark">
  <div class="container">
    <div class="row">
        <div class="col">
            <div class="card mt-5" style="width: 100%; height:100%;">
                <div class="card-header">
                    <div class="col-12 text-danger text-center">
                        <h2>House Price Predictor</h2>
                    </div>
                </div>
                <div class="card-body">
                    <form>
                        <div class="form-group">
                            <label><b>Select Location</b></label>
                            <select class="form-control mt-2" name="location" id="location">
                                {%for location in locations%}
                                <option value="{{location}}">{{location}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group mt-2">
                            <label><b>Select Area in Sqft</b></label>
                            <input class="form-control mt-2" type="text" id="sqft" name="sqft"></input>
                        </div>
                         <div class="form-group mt-2">
                            <label><b>No. of Bathroom</b></label>
                            <input class="form-control mt-2" type="text" id="bath" name="bath"></input>
                        </div>
                         <div class="form-group mt-2">
                            <label><b>Type of Flat(2/3/4/5)</b></label>
                            <input class="form-control mt-2" type="text" id="bhk" name="bhk"></input>
                        </div>
                        <input class="btn btn-primary mt-3" type="button" value="Predict House Price" onclick="predictprice()"/>
                    </form>
                    <h1 class="text-center text-danger" id="result">₹</h1>
                </div>
            </div>
            
        </div>
    </div>
  </div>  
</body>
</html>
